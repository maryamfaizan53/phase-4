[project]
name = "todo-ai-chatbot"
version = "0.1.0"
description = "Conversational AI todo management system with agentic architecture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.25.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.5.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "mcp>=0.1.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "passlib>=1.7.4",
    "email-validator>=2.0.0",
    "dapr>=0.1.0",
    "confluent-kafka>=2.2.0",
    "kubernetes>=26.1.0",
    "redis>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
